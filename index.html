<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b6fe0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c212b" media="(prefers-color-scheme: dark)">
<title>Révisions 6e</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1d2433; --mute:#667085; --line:#e3e7ef;
  --pri:#3b6fe0; --pri-ink:#ffffff; --soft:#eaf0fd;
  --ok:#1f9d55; --ok-bg:#e3f6ea; --ko:#d64545; --ko-bg:#fdeaea; --warn-bg:#fff6e0;
  --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12151c; --card:#1c212b; --ink:#e8ecf3; --mute:#9aa4b5; --line:#2c3341;
    --pri:#6b95f5; --pri-ink:#0d1220; --soft:#222c40;
    --ok:#4cc683; --ok-bg:#16301f; --ko:#f07878; --ko-bg:#3a1c1c; --warn-bg:#3a2f12;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
a{color:var(--pri)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;
  padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line)}
header .logo{font-weight:800;font-size:20px;text-decoration:none;color:var(--ink);flex:1}
header .streak{font-weight:700;white-space:nowrap}
header .gear{font-size:24px;text-decoration:none}
main{max-width:980px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:26px;margin:8px 0 12px} h2{font-size:21px;margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin:12px 0}
.notice{background:var(--warn-bg)}
.mute{color:var(--mute)} .center{text-align:center} .small{font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 20px;
  border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  font-family:inherit;font-weight:600;font-size:18px;line-height:1.2;text-decoration:none;cursor:pointer;user-select:none}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.danger{color:var(--ko)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.big{min-height:76px;font-size:21px;border-radius:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 6px}
@media (max-width:560px){.hero{grid-template-columns:1fr}}
.pill{background:rgba(255,255,255,.25);border-radius:99px;padding:2px 10px;font-size:17px}
.badge{display:inline-block;background:var(--warn-bg);border-radius:99px;padding:1px 10px;font-size:14px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{display:block;background:var(--card);border:1px solid var(--line);border-left:6px solid hsl(var(--h) 65% 55%);
  border-radius:16px;padding:14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.tile-t{font-weight:700;font-size:19px}
.tile-m{color:var(--mute);font-size:15px;margin-top:6px}
.stars{color:#f2a900;letter-spacing:2px}
.mat{display:flex;align-items:center;gap:8px}
.mat::before{content:"";width:12px;height:12px;border-radius:4px;background:hsl(var(--h) 65% 55%)}
label{display:block;font-weight:600;margin:12px 0 6px}
input[type=text],input[type=password],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{resize:vertical}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:12px 0}
.thumb{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:18px}
.filebtn{position:relative;overflow:hidden}
.pick{cursor:pointer}
.pick.on{outline:4px solid var(--pri);outline-offset:-4px}
.pick .tick{display:none;position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;background:var(--pri);color:var(--pri-ink);
  align-items:center;justify-content:center;font-weight:800}
.pick.on .tick{display:flex}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.spinner{width:56px;height:56px;border-radius:50%;border:6px solid var(--soft);border-top-color:var(--pri);animation:spin 1s linear infinite;margin:24px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.item{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:var(--bg)}
.item-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;color:var(--mute)}
.item-h button{border:0;background:none;font-size:22px;cursor:pointer}
.choice-row{display:flex;gap:8px;align-items:center;margin:6px 0}
.choice-row input[type=radio]{width:24px;height:24px;flex:none}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));
  background:var(--card);border-top:1px solid var(--line);display:flex;gap:10px;justify-content:center;z-index:5}
.progress{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.progress div{height:100%;background:var(--pri);border-radius:99px;transition:width .3s}
.play{max-width:760px;margin:0 auto}
.q{font-size:24px;font-weight:650;line-height:1.35;margin:6px 0 18px}
.kind{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.choices{display:grid;gap:10px}
.choices .btn{justify-content:flex-start;text-align:left;min-height:62px;font-weight:550}
.btn.good{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.btn.bad{background:var(--ko-bg);border-color:var(--ko);color:var(--ink)}
.btn.sel{background:var(--soft);border:2px solid var(--pri)}
.flash{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  font-size:26px;font-weight:650;cursor:pointer;border:2px dashed var(--line)}
.flash .verso{color:var(--pri);margin-top:16px}
.fb{border-radius:14px;padding:14px;margin:14px 0;font-size:19px}
.fb.ok{background:var(--ok-bg)} .fb.ko{background:var(--ko-bg)}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--pri);text-align:center;color:var(--pri)}
.speak{border:0;background:none;font-size:24px;cursor:pointer;vertical-align:middle}
.resume li{margin:10px 0;font-size:20px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;display:flex;align-items:center;justify-content:center}
.overlay img{max-width:100%;max-height:100%}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:90vw}
#toast.on{opacity:1}
.big-emoji{font-size:72px;text-align:center;margin:10px 0}
body.locked header .streak, body.locked header .gear, body.locked header .sync{visibility:hidden}
header .sync{font-size:20px}
body.locked header .logo{pointer-events:none}
.lock{max-width:460px;margin:24px auto}
.pin-dots{display:flex;gap:18px;justify-content:center;margin:18px 0 22px}
.pin-dots span{width:22px;height:22px;border-radius:50%;border:3px solid var(--pri)}
.pin-dots span.on{background:var(--pri)}
.keypad{display:grid;grid-template-columns:repeat(3,84px);gap:14px;justify-content:center}
.keypad.off{opacity:.35;pointer-events:none}
.key{width:84px;height:84px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-weight:700;font-size:32px;line-height:1;cursor:pointer}
.key:active{background:var(--soft)}
.shake{animation:shake .4s} @keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.lvl-banner{display:flex;gap:16px;align-items:center;flex-wrap:wrap;text-decoration:none;color:var(--ink)}
.lvl-hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.lvl-emoji{font-size:46px;line-height:1} .lvl-emoji.big{font-size:76px}
.lvl-name{font-weight:800;font-size:19px}
.xpbar{height:14px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:8px}
.xpbar div{height:100%;background:linear-gradient(90deg,#f7b733,#fc4a1a);border-radius:99px;transition:width 1.4s ease}
.xp-gain{font-size:42px;font-weight:800;color:#f7931e;margin:8px 0}
.week{display:flex;justify-content:space-around}
.wday{display:flex;flex-direction:column;align-items:center;gap:6px}
.dot{width:40px;height:40px;border-radius:50%;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.dot.some{background:var(--soft);border-color:var(--pri)} .dot.full{background:var(--ok);border-color:var(--ok)}
.wday.today .dot{box-shadow:0 0 0 3px var(--pri)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.matcard{border-top:6px solid hsl(var(--h) 65% 55%);margin:0}
.lrow{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:16px}
.crowns{white-space:nowrap;font-size:14px;letter-spacing:-1px} .crowns .off{filter:grayscale(1);opacity:.25}
.bdg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.bdg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.bdg-e{font-size:40px} .bdg.locked{opacity:.5} .bdg.locked .bdg-e{filter:grayscale(1)}
.newbadges{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.badge.good-b{background:var(--ok-bg)}
.ptable{border-collapse:collapse;width:100%} .ptable td,.ptable th{border-bottom:1px solid var(--line);padding:6px;text-align:left}
.pop{animation:pop .5s ease both} @keyframes pop{0%{transform:scale(.3);opacity:0}80%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
.confetti{position:fixed;top:-40px;font-size:28px;z-index:40;pointer-events:none;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:8px 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.check input{width:24px;height:24px;flex:none;margin:2px 0 0}
.print-doc{background:#fff;color:#111;padding:24px;border-radius:12px;font-size:16px;line-height:1.5}
.print-doc h2{font-size:24px} .print-doc h3{font-size:19px} .print-doc h4{font-size:17px}
.print-doc table{border-collapse:collapse;width:100%;margin:10px 0}
.print-doc td,.print-doc th{border:1px solid #999;padding:6px 8px;text-align:left}
.sheet + .sheet{margin-top:32px;border-top:2px dashed #bbb;padding-top:24px}
.sheet-meta{color:#666;font-size:13px;margin:0}
@media print{
  header,.noprint,#toast,.sticky{display:none!important}
  html,body{background:#fff}
  main{padding:0;max-width:none}
  .print-doc{padding:0;border-radius:0}
  .sheet + .sheet{break-before:page;border:0;margin:0;padding:0}
  @page{margin:15mm}
}
</style>

<body>
<header>
  <a class="logo" href="#/">📚 Révisions 6e</a>
  <span class="sync" id="sync"></span>
  <span class="streak" id="streak"></span>
  <a class="gear" href="#/settings" aria-label="Réglages">⚙️</a>
</header>
<main id="app"></main>
<div id="toast"></div>
<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const MATIERES = ['Français','Maths','Histoire-Géo','EMC','SVT','Physique-Chimie','Technologie','Anglais','Espagnol','Allemand','Musique','Arts plastiques','Autre'];
const INTERVALS = [0, 1, 2, 4, 8, 16];          // jours avant la prochaine révision, par boîte Leitner
const DAILY_MAX = 20;                           // questions par séance « Réviser aujourd'hui »
const MAX_PHOTOS = 6;
const APP_VERSION = 19;
const KIND = { card: 'Carte', qcm: 'QCM', vf: 'Vrai ou faux', trou: 'Texte à trous' };

// ---------- Stockage local (IndexedDB) ----------
let dbp;
function db() {
  return dbp ||= new Promise((res, rej) => {
    const r = indexedDB.open('revision6e', 1);
    r.onupgradeneeded = () => {
      r.result.createObjectStore('lessons', { keyPath: 'id' });
      r.result.createObjectStore('kv', { keyPath: 'k' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function tx(store, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode);
    let out;
    const r = fn(t.objectStore(store));
    if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out);
    t.onerror = t.onabort = () => rej(t.error);
  });
}
const Lessons = {
  all: () => tx('lessons', 'readonly', s => s.getAll()),
  get: id => tx('lessons', 'readonly', s => s.get(id)),
  put: (l, fromSync) => { if (!fromSync) { l.updatedAt = Date.now(); markDirty('l', l.id); } return tx('lessons', 'readwrite', s => s.put(l)); },
  del: (id, fromSync) => { if (!fromSync) markDirty('l', id); return tx('lessons', 'readwrite', s => s.delete(id)); },
};
const KV = {
  async get(k, def) { const r = await tx('kv', 'readonly', s => s.get(k)); return r ? r.v : def; },
  set: (k, v, fromSync) => {
    if (META_KEYS.has(k) && !fromSync) { tx('kv', 'readwrite', s => s.put({ k: 'metaAt', v: Date.now() })); markDirty('m'); }
    return tx('kv', 'readwrite', s => s.put({ k, v }));
  },
};
const META_KEYS = new Set(['stats', 'streak', 'goal', 'name']);   // progrès et réglages qui suivent le compte

// ---------- Utilitaires ----------
function today() { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); }
const dateFr = ts => new Date(ts).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
function hue(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function mastery(l) { return l.items.length ? l.items.reduce((a, it) => a + Math.min(it.box || 0, 5), 0) / (5 * l.items.length) : 0; }
function starsOf(l) { const c = crownsOf(l); return `<span class="crowns" title="${c} couronnes sur 5">${'👑'.repeat(c)}<span class="off">${'👑'.repeat(5 - c)}</span></span>`; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600); }
function speak(text) {
  if (!('speechSynthesis' in window)) return toast('Lecture à voix haute indisponible');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(/_{2,}/g, ' blanc ')); u.lang = 'fr-FR'; u.rate = .95;
  speechSynthesis.speak(u);
}
const speakBtn = text => `<button class="speak" aria-label="Lire" onclick="speak(${esc(JSON.stringify(text))})">🔊</button>`;
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[’`]/g, "'").replace(/[^a-z0-9' ]/g, ' ').replace(/\s+/g, ' ').trim()
  .replace(/^(l'|le |la |les |un |une |des |du |de la |de l')/, '').trim();

let objectUrls = [], nextUrls = [];
function urlOf(blob) { const u = URL.createObjectURL(blob); nextUrls.push(u); return u; }
function setView(html) {
  objectUrls.forEach(u => URL.revokeObjectURL(u));
  objectUrls = nextUrls; nextUrls = [];
  $('#app').innerHTML = html;
  window.scrollTo(0, 0);
}
async function renderStreak() {
  const st = await KV.get('streak', { last: -1, n: 0 });
  const n = st.last >= today() - 1 ? st.n : 0;
  $('#streak').textContent = n ? `🔥 ${n} jour${n > 1 ? 's' : ''}` : '';
}
async function bumpStreak() {
  const t = today(); const st = await KV.get('streak', { last: -1, n: 0 });
  if (st.last === t) return;
  st.n = st.last === t - 1 ? st.n + 1 : 1; st.last = t;
  await KV.set('streak', st); renderStreak();
}

// ---------- Photos ----------
async function compress(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', .85));
}
function showPhoto(src) {
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<img src="${src}" alt="">`; o.onclick = () => o.remove();
  document.body.appendChild(o);
}

// ---------- Réponse de ChatGPT ----------
class ApiError extends Error {}
function parseJsonText(text) {
  const t = String(text || '').replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  const a = t.indexOf('{'), z = t.lastIndexOf('}');
  if (a < 0 || z < a) throw new ApiError('Je ne trouve pas de quiz dans cette réponse.');
  try { return JSON.parse(t.slice(a, z + 1)); } catch { throw new ApiError('Le quiz de cette réponse est illisible : redemande-le à ChatGPT.'); }
}
function toLesson(r, blobs, matiere) {
  const s = v => String(v ?? '').trim();
  const items = [];
  for (const c of r.flashcards || []) if (s(c.recto) && s(c.verso)) items.push({ type: 'card', recto: s(c.recto), verso: s(c.verso) });
  for (const q of r.qcm || []) {
    const choix = (q.choix || []).map(s).filter(Boolean); const b = Number(q.bonne);
    if (s(q.question) && choix.length >= 2 && b >= 0 && b < choix.length)
      items.push({ type: 'qcm', question: s(q.question), choix, bonne: b, explication: s(q.explication) });
  }
  for (const v of r.vrai_faux || []) if (s(v.affirmation)) items.push({ type: 'vf', affirmation: s(v.affirmation), vrai: !!v.vrai, correction: s(v.correction) });
  for (const t of r.trous || []) {
    const phrase = s(t.phrase).replace(/_{2,}/g, '___');
    if (phrase.includes('___') && s(t.reponse)) items.push({ type: 'trou', phrase, reponse: s(t.reponse) });
  }
  items.forEach(it => Object.assign(it, { id: uid(), box: 0, due: 0 }));
  const m = matiere && matiere !== 'auto' ? matiere : (MATIERES.includes(s(r.matiere)) ? s(r.matiere) : 'Autre');
  return { id: uid(), createdAt: Date.now(), status: 'draft', matiere: m, titre: s(r.titre) || 'Leçon sans titre',
    resume: (r.resume || []).map(s).filter(Boolean), photos: blobs, items };
}

// ---------- Vues ----------
const act = {};
const dueEntries = ls => ls.filter(l => l.status === 'ready' || l.status === 'draft').flatMap(l => l.items.filter(it => (it.due || 0) <= today()).map(it => ({ l, it })));

async function viewHome() {
  const ls = (await Lessons.all()).sort((a, b) => b.createdAt - a.createdAt);
  const due = dueEntries(ls).length;
  let h = '';
  await loadPending();
  if (pending.length) h += `<div class="card notice">📷 ${pending.length} photo${pending.length > 1 ? 's' : ''} en attente : <a href="#/new">reprendre la nouvelle leçon</a>.</div>`;
  h += await progressBanner();
  h += `<div class="hero">
    <a class="btn big pri" href="#/daily">🧠 Réviser aujourd'hui <span class="pill">${Math.min(due, DAILY_MAX)}</span></a>
    <a class="btn big" href="#/new">📷 Nouvelle leçon</a></div>`;
  if (!ls.length) h += `<p class="mute center">Aucune leçon pour l'instant. Prends en photo une leçon du cahier !</p>`;
  const byMat = {};
  for (const l of ls) (byMat[l.matiere] ||= []).push(l);
  for (const m of Object.keys(byMat).sort((a, b) => a.localeCompare(b, 'fr'))) {

function mdToHtml(md) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<i>$2</i>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  const lines = md.replace(/\r/g, '').split('\n'); let h = '', list = null, para = [];
  const flush = () => { if (para.length) { h += `<p>${para.map(inline).join('<br>')}</p>`; para = []; } if (list) { h += `</${list}>`; list = null; } };
  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i];
    let m;
    if (!ln.trim()) { flush(); continue; }
    if ((m = ln.match(/^(#{1,4})\s+(.*)$/))) { flush(); const n = Math.min(m[1].length + 1, 4); h += `<h${n}>${inline(m[2])}</h${n}>`; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(ln)) { flush(); h += '<hr>'; continue; }
    if (/^\s*\|.*\|\s*$/.test(ln)) {
      flush(); const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      i--;
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      h += '<table>' + body.map((r, k) => `<tr>${cells(r).map(c => k === 0 && rows.length > body.length ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join('')}</tr>`).join('') + '</table>';
      continue;
    }
    if ((m = ln.match(/^\s*(?:[-*+]|(\d+)[.)])\s+(.*)$/))) {
      const kind = m[1] ? 'ol' : 'ul';
      if (para.length) flush();
      if (list !== kind) { if (list) h += `</${list}>`; h += `<${kind}>`; list = kind; }
      const box = /^\[[ x]\]\s*/i.test(m[2]);
      h += `<li${box ? ' style="list-style:none"' : ''}>${inline(m[2].replace(/^\[ \]\s*/, '☐ ').replace(/^\[x\]\s*/i, '☑ '))}</li>`;
      continue;
    }
    if (list) { h += `</${list}>`; list = null; }
    para.push(ln.trim());
  }
  flush();
  return h;
}

    <button class="btn pri" onclick="act.saveReview()">💾 Enregistrer</button></div>`;

function readReview(l) {
  l.titre = $('#r-titre').value.trim() || l.titre;
  l.matiere = $('#r-mat').value;
  l.resume = $('#r-resume').value.split('\n').map(x => x.trim()).filter(Boolean);
  for (const it of l.items) {
    const el = $(`[data-id="${it.id}"]`); if (!el) continue;
    el.querySelectorAll('[data-f]').forEach(inp => {
      const f = inp.dataset.f;
      if (f === 'choix') it.choix[+inp.dataset.i] = inp.value.trim();
      else if (f === 'vrai') it.vrai = inp.value === '1';

      const good = it.choix[it.bonne];
      it.choix = it.choix.filter(Boolean);
      it.bonne = Math.max(0, it.choix.indexOf(good));

    if (it.type === 'trou') it.phrase = it.phrase.replace(/_{2,}/g, '___');
  }
}

// --- Progrès : XP, niveaux, objectif du jour, badges, suivi par matière (tout reste sur l'appareil)
const XP_OK = 10, XP_END = 20;
const LEVELS = [[0, '🐣', 'Poussin curieux'], [100, '🐸', 'Têtard malin'], [250, '🦊', 'Petit renard rusé'], [500, '🦉', 'Apprenti savant'],
  [800, '🧭', 'Explorateur'], [1200, '🕵️', 'Détective du savoir'], [1700, '🦸', 'Super cerveau'], [2300, '🏅', 'Champion des leçons'],
  [3000, '🚀', 'Maître des révisions'], [4000, '👑', 'Génie de la 6e']];
function levelOf(xp) {
  let i = LEVELS.length - 1;
  while (i > 0 && xp < LEVELS[i][0]) i--;
  if (i < LEVELS.length - 1) return { n: i + 1, emoji: LEVELS[i][1], name: LEVELS[i][2], from: LEVELS[i][0], to: LEVELS[i + 1][0], next: LEVELS[i + 1] };
  const extra = Math.floor((xp - LEVELS[i][0]) / 1200);       // au-delà du dernier palier : un niveau tous les 1200 XP
  const from = LEVELS[i][0] + extra * 1200;
  return { n: i + 1 + extra, emoji: LEVELS[i][1], name: LEVELS[i][2], from, to: from + 1200, next: [from + 1200, LEVELS[i][1], LEVELS[i][2]] };
}
const BADGES = [
  ['first_lesson', '🥇', 'Première leçon', 'Créer sa première leçon', s => s.lessons >= 1],
  ['first_quiz', '🎮', 'Premier quiz', 'Terminer un quiz', s => s.sessions >= 1],
  ['perfect', '💯', 'Sans-faute', 'Un quiz de 5 questions ou plus sans erreur', s => s.perfect >= 1],
  ['goal', '⭐', 'Objectif atteint', "Atteindre l'objectif du jour", s => s.goalDays >= 1],
  ['streak3', '🔥', '3 jours de suite', "Réviser 3 jours d'affilée", s => s.best >= 3],
  ['streak7', '☄️', '7 jours de suite', "Réviser 7 jours d'affilée", s => s.best >= 7],
  ['ok100', '🎯', '100 bonnes réponses', '100 bonnes réponses au total', s => s.ok >= 100],
  ['ok500', '🏹', '500 bonnes réponses', '500 bonnes réponses au total', s => s.ok >= 500],
  ['crown', '👑', 'Leçon maîtrisée', 'Obtenir 5 couronnes sur une leçon', s => s.crowned >= 1],
  ['mats3', '🧭', 'Touche-à-tout', 'Des leçons dans 3 matières', s => s.matCount >= 3],
  ['mat5', '📚', 'Spécialiste', '5 leçons dans une même matière', s => s.maxMatLessons >= 5],
  ['level5', '🚀', 'Niveau 5', 'Atteindre le niveau 5', s => s.level >= 5],
];
const crownsOf = l => Math.min(5, Math.floor(mastery(l) * 5 + 1e-9));
let ST = null;
async function loadStats() {
  if (ST) return ST;
  ST = await KV.get('stats', null);
  if (!ST) {   // premier lancement du suivi : on part des réponses déjà données
    ST = { xp: 0, ok: 0, n: 0, sessions: 0, perfect: 0, best: 0, days: {}, mats: {}, badges: {} };
    for (const l of await Lessons.all()) for (const it of l.items) {
      const m = ST.mats[l.matiere] ||= { ok: 0, n: 0, quiz: 0, sessions: [] };
      ST.ok += it.ok || 0; ST.n += it.seen || 0; m.ok += it.ok || 0; m.n += it.seen || 0;
    }
    ST.xp = ST.ok * XP_OK;
    await KV.set('stats', ST);
  }
  return ST;
}
const saveStats = () => KV.set('stats', ST);
const dayStat = () => ST.days[today()] ||= { xp: 0, ok: 0, n: 0 };
function gainXp(x) { ST.xp += x; dayStat().xp += x; if (S) S.xp = (S.xp || 0) + x; }
function track(mat, correct) {     // une réponse donnée pendant un quiz
  const d = dayStat(), m = ST.mats[mat] ||= { ok: 0, n: 0, quiz: 0, sessions: [] }, sm = S.byMat[mat] ||= { ok: 0, n: 0 };
  ST.n++; d.n++; m.n++; sm.n++;
  if (correct) { ST.ok++; d.ok++; m.ok++; sm.ok++; gainXp(XP_OK); }
  saveStats();
}
function trackFix(mat) {           // « J'avais bon quand même »
  const d = dayStat(), m = ST.mats[mat], sm = S.byMat[mat];
  ST.ok++; d.ok++; m.ok++; sm.ok++; gainXp(XP_OK); saveStats();
}
async function streakNow() { const st = await KV.get('streak', { last: -1, n: 0 }); return st.last >= today() - 1 ? st.n : 0; }
async function badgeContext() {
  const ls = (await Lessons.all()).filter(l => l.status !== 'package');
  const goal = await KV.get('goal', 50), per = {};
  for (const l of ls) per[l.matiere] = (per[l.matiere] || 0) + 1;
  return { lessons: ls.length, sessions: ST.sessions, perfect: ST.perfect, ok: ST.ok, best: Math.max(ST.best, await streakNow()),
    goalDays: Object.values(ST.days).filter(d => d.xp >= goal).length, crowned: ls.filter(l => l.items.length && crownsOf(l) >= 5).length,
    matCount: Object.keys(per).length, maxMatLessons: Math.max(0, ...Object.values(per)), level: levelOf(ST.xp).n };
}
async function checkBadges() {
  const ctx = await badgeContext(), won = [];
  for (const [id, emo, name, , test] of BADGES) if (!ST.badges[id] && test(ctx)) { ST.badges[id] = Date.now(); won.push([emo, name]); }
  if (won.length) await saveStats();
  return won;
}
async function finishSession() {   // fin de quiz : bonus, historique par matière, badges
  if (S.result) return S.result;
  const perfect = S.answered >= 5 && S.ok === S.answered;
  const bonus = S.answered ? XP_END * (perfect ? 2 : 1) : 0;
  gainXp(bonus);
  if (S.answered) {
    ST.sessions++; if (perfect) ST.perfect++;
    for (const [mat, r] of Object.entries(S.byMat)) {
      const m = ST.mats[mat]; m.quiz = (m.quiz || 0) + 1;
      m.sessions = [...m.sessions, { d: today(), ok: r.ok, n: r.n }].slice(-30);
    }
  }
  ST.best = Math.max(ST.best, await streakNow());
  await saveStats();
  S.result = { bonus, perfect, badges: await checkBadges() };
  return S.result;
}
function ring(value, goal, size = 64) {
  const r = size / 2 - 6, c = 2 * Math.PI * r, f = Math.min(1, goal ? value / goal : 0);

    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="var(--soft)" stroke-width="8" fill="none"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="${f >= 1 ? 'var(--ok)' : 'var(--pri)'}" stroke-width="8" fill="none"
      stroke-linecap="round" stroke-dasharray="${f * c} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
    <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-size="${size / 4.2}" font-weight="700" fill="var(--ink)">${f >= 1 ? '⭐' : Math.round(f * 100) + '%'}</text></svg>`;

function levelBar(lv, xp) {

function spark(sessions) {
  const pts = sessions.slice(-10).map(s => s.n ? s.ok / s.n : 0);
  if (pts.length < 2) return '<span class="small mute">courbe après 2 quiz</span>';
  const w = 150, h = 40, step = w / (pts.length - 1);

    ${xy.map(p => `<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="3" fill="var(--pri)"/>`).join('')}</svg>`;

function trend(sessions) {

function grade(correct) {

  if (correct) { it.box = Math.min((it.box || 0) + 1, 5); it.due = today() + INTERVALS[it.box]; }
  else {

const NETLIFY_HOST = 'revisions-6e-fa03df.netlify.app';
let API_URL = '';
async function apiBase() {     // l'API du site qui sert l'app si elle existe (Netlify), sinon celle du site Netlify
  if (API_URL) return API_URL;
  try {
    const r = await fetch(location.origin + '/api/health', { cache: 'no-store' });
    if (r.ok && (r.headers.get('content-type') || '').includes('json')) return API_URL = location.origin + '/api';
  } catch {}

}
let online = null, dirtyP = null, syncTimer = null, syncing = false, lastPin = '', resetParent = null;
async function api(method, path, body, raw) {
  const token = await KV.get('session', ''), headers = {};
  if (token) headers.authorization = 'Bearer ' + token;
  if (body !== undefined && !raw) headers['content-type'] = 'application/json';
  const res = await fetch((await apiBase()) + path, { method, headers, cache: 'no-store',
    body: body === undefined ? undefined : raw ? body : JSON.stringify(body) });
  const type = res.headers.get('content-type') || '';
  const data = type.includes('json') ? await res.json().catch(() => null) : res.ok ? await res.blob() : null;
  if (res.status === 401 && token && !['/login', '/reset', '/setup'].includes(path)) await KV.set('session', '');

}
async function serverInfo(force) {

async function pushLesson(id) {
  const l = await Lessons.get(id);
  if (!l) { const r = await api('DELETE', '/lesson/' + id); return r.ok || r.status === 404; }
  for (let i = l._up || 0; i < (l.photos || []).length; i++) if (!(await api('PUT', `/photo/${id}/${i}`, l.photos[i], true)).ok) return false;
  const r = await api('PUT', '/lesson/' + id, strip(l));

  const cur = await Lessons.get(id);

      const loc = local.get(id);
      if (d.lessons[id] || (loc && (loc.updatedAt || 0) >= at)) continue;
      const r = await api('GET', '/lesson/' + id); if (!r.ok) continue;
      const { nPhotos = 0, ...remote } = r.data;
      let photos = loc?.photos?.length === nPhotos ? loc.photos : [];
      if (photos.length !== nPhotos) for (let i = 0; i < nPhotos; i++) { const p = await api('GET', `/photo/${id}/${i}`); if (p.ok) photos.push(p.data); }
      await Lessons.put({ ...remote, photos, files: loc?.files || [], _up: photos.length, _synced: true }, true);
      changed = true;
    }
    for (const [id, loc] of local) if (loc._synced && !(id in (idx.data.lessons || {})) && !d.lessons[id]) { await Lessons.del(id, true); changed = true; }
    if ((idx.data.metaAt || 0) > (await KV.get('metaAt', 0)) && !d.meta) {
      const r = await api('GET', '/meta'); if (r.ok && r.data?.stats) { await applyMeta(r.data); changed = true; }
    }
    await KV.set('syncAt', Date.now());
    setSync('ok');
    if (changed && !location.hash.startsWith('#/play') && !document.body.classList.contains('locked')) route();
  } catch { setSync('err'); scheduleSync(30000); }
  finally { syncing = false; }
}
window.addEventListener('online', () => { online = null; scheduleSync(500); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') scheduleSync(800); });

// --- Verrou : code secret à 4 chiffres pour un seul enfant
// Avec le compte en ligne, le code est vérifié par le serveur (blocage commun à tous les appareils) ;
// sans connexion, par son empreinte PBKDF2 gardée sur l'appareil. Le code n'est jamais stocké en clair.
// Le code parent de secours (choisi par le parent, 6 caractères ou plus) permet d'en choisir un nouveau.
const LOCK_AFTER = 5 * 60 * 1000;          // verrouille après 5 min en arrière-plan
const PIN_ITER = 150000;
let unlocked = false, hiddenAt = 0, pinBuf = '', lockMode = 'unlock', firstPin = '', lockTimer = null;
const deName = n => (/^[aeiouyhéèêëàâîïôû]/i.test(n) ? 'd’' : 'de ') + n;   // « d’Eden », « de Léo »
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function digest(secret, salt) {
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveBits']);
  return toB64(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: PIN_ITER, hash: 'SHA-256' }, key, 256));
}
async function sealed(secret) { const salt = crypto.getRandomValues(new Uint8Array(16)); return { salt: toB64(salt), hash: await digest(secret, salt) }; }
const matches = async (secret, rec) => rec && (await digest(secret, fromB64(rec.salt))) === rec.hash;
const PARENT_MIN = 6;
function setLocked(on) { document.body.classList.toggle('locked', on); }
async function viewLock() {
  setLocked(true);
  const lock = await KV.get('lock', null), name = await KV.get('name', '') || 'Eden', info = await serverInfo();
  if (!lock && lockMode === 'unlock' && !info?.account) lockMode = 'setup1';
  const activation = lockMode === 'parent' && info && !info.account;
  const wait = lock?.until && lock.until > Date.now() ? Math.ceil((lock.until - Date.now()) / 1000) : 0;
  const lv = ST ? levelOf(ST.xp) : null;
  const title = activation ? '☁️ Activer le compte en ligne' : {
    unlock: `Bonjour ${esc(name)} 👋`, setup1: lock ? 'Nouveau code secret' : `Le code secret ${esc(deName(name))}`,
    setup2: 'Encore une fois, pour vérifier', rescue: 'Code parent de secours', parent: '🗝️ Code parent de secours',
  }[lockMode];
  const sub = activation
    ? `À faire par un parent : choisis le code parent (${PARENT_MIN} caractères ou plus) et tape le code d'activation. Les leçons et les progrès ${esc(deName(name))} seront gardés dans son compte et retrouvés sur ses autres appareils.`
    : {
      unlock: wait ? `Trop d'essais : attends <b id="lock-wait">${wait}</b> s` : 'Tape ton code secret',
      setup1: 'Choisis 4 chiffres faciles à retenir pour toi, et que personne d\'autre ne connaît.',
      setup2: 'Tape le même code.', rescue: 'Le code choisi par le parent quand le code secret a été créé.',
      parent: `À choisir par un parent (${PARENT_MIN} caractères ou plus : lettres, chiffres…). Il permet de choisir un nouveau code secret si ${esc(name)} oublie le sien. Garde-le pour toi.`,
    }[lockMode];
  let body;
  const eye = id => `<button type="button" class="btn" onclick="const i=$('#${id}');i.type=i.type==='password'?'text':'password'">👁️</button>`;
  if (lockMode === 'rescue') body = `<form onsubmit="act.rescue(event)" style="max-width:360px;margin:0 auto">
      <div class="row"><input type="password" id="r-code" autocomplete="off" autocapitalize="off" placeholder="Code parent" style="flex:1;font-size:22px">${eye('r-code')}</div>
      <div class="row" style="justify-content:center;margin-top:12px"><button type="button" class="btn" onclick="lockMode='unlock';viewLock()">Annuler</button><button class="btn pri">Valider</button></div></form>`;
  else if (lockMode === 'parent') body = `<form onsubmit="act.saveParent(event)" style="max-width:360px;margin:0 auto;text-align:left">
      <label for="pa-1">Code parent</label>
      <div class="row"><input type="password" id="pa-1" autocomplete="new-password" autocapitalize="off" style="flex:1;font-size:20px">${eye('pa-1')}</div>
      <label for="pa-2">Encore une fois</label>
      <div class="row"><input type="password" id="pa-2" autocomplete="new-password" autocapitalize="off" style="flex:1;font-size:20px">${eye('pa-2')}</div>
      ${activation ? `<label for="pa-act">Code d'activation</label>
      <input type="text" id="pa-act" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX" style="font-size:20px;letter-spacing:2px">` : ''}
      <div class="row" style="justify-content:center;margin-top:14px">
        ${activation && !unlocked ? '<button type="button" class="btn" onclick="act.later()">Plus tard</button>' : ''}
        ${lock?.rescue && unlocked ? '<button type="button" class="btn" onclick="act.cancelPin()">Annuler</button>' : ''}<button class="btn pri">${activation ? 'Activer' : 'Enregistrer'}</button></div></form>`;
  else body = `<div class="pin-dots" id="pin-dots">${[0, 1, 2, 3].map(i => `<span class="${i < pinBuf.length ? 'on' : ''}"></span>`).join('')}</div>
    <div class="keypad${wait ? ' off' : ''}">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map(k =>
      k ? `<button class="key" onclick="act.key('${k}')">${k}</button>` : '<span></span>').join('')}</div>
    ${lockMode === 'unlock' ? '<button class="btn" style="margin-top:18px" onclick="lockMode=\'rescue\';pinBuf=\'\';viewLock()">Code oublié ?</button>' : ''}
    ${lockMode !== 'unlock' && unlocked ? '<button class="btn" style="margin-top:18px" onclick="act.cancelPin()">Annuler</button>' : ''}`;
  setView(`<div class="lock center">
    <div class="big-emoji">${activation ? '☁️' : lockMode === 'unlock' ? (lv ? lv.emoji : '🔒') : '🔐'}</div>
    <h1>${title}</h1><p class="mute">${sub}</p>${body}</div>`);
  clearInterval(lockTimer);
  if (wait) lockTimer = setInterval(() => {
    const el = $('#lock-wait'); if (!el) return clearInterval(lockTimer);
    const s = +el.textContent - 1; if (s <= 0) { clearInterval(lockTimer); viewLock(); } else el.textContent = s;
  }, 1000);
}
const shakeAndRetry = () => { const dots = $('#pin-dots'); dots?.classList.add('shake'); setTimeout(() => viewLock(), 450); };
async function onlineUnlocked(pin, token) {   // code accepté par le serveur : cet appareil est connecté au compte
  const lock = await KV.get('lock', null);
  await KV.set('session', token);
  await KV.set('lock', { ...(lock || {}), ...(await sealed(pin)), fails: 0, until: 0 });
  lastPin = pin; online = { ok: true, account: true };
  await firstLink(); lockMode = 'unlock'; finishUnlock();
}
act.key = async k => {
  if ($('.keypad.off')) return;
  if (k === '⌫') pinBuf = pinBuf.slice(0, -1); else if (pinBuf.length < 4) pinBuf += k;
  $('#pin-dots').innerHTML = [0, 1, 2, 3].map(i => `<span class="${i < pinBuf.length ? 'on' : ''}"></span>`).join('');
  if (pinBuf.length < 4) return;
  const pin = pinBuf; pinBuf = '';
  if (lockMode === 'setup1') { firstPin = pin; lockMode = 'setup2'; return viewLock(); }
  if (lockMode === 'setup2') {
    if (pin !== firstPin) { lockMode = 'setup1'; toast('Les deux codes sont différents, recommence'); return viewLock(); }
    firstPin = '';
    if (resetParent !== null) {          // code oublié, compte en ligne : le serveur vérifie le code parent
      const parent = resetParent; resetParent = null;
      const r = await api('POST', '/reset', { parent, pin }).catch(() => null);
      if (r?.ok) { const l = await KV.get('lock', null); await KV.set('lock', { ...(l || {}), rescue: await sealed(parent) }); toast('Nouveau code enregistré 🔒'); return onlineUnlocked(pin, r.data.token); }
      lockMode = 'rescue';
      toast(r?.status === 423 ? `Trop d'essais : attends ${r.data.wait} s` : r ? 'Code parent incorrect' : 'Pas de connexion internet');
      return viewLock();
    }
    const old = await KV.get('lock', null);
    if (old && unlocked && (await KV.get('session', ''))) {       // changement de code : aussi dans le compte
      const r = await api('POST', '/pin', { pin }).catch(() => null);
      if (!r?.ok) { toast('Code non changé : il faut une connexion internet'); return act.cancelPin(); }
    }
    await KV.set('lock', { ...(await sealed(pin)), rescue: old?.rescue || null, fails: 0, until: 0 });
    if (!(await KV.get('name', ''))) await KV.set('name', 'Eden');
    lastPin = pin;
    if (!old?.rescue) { lockMode = 'parent'; return viewLock(); }   // première création : le parent choisit son code
    lockMode = 'unlock'; toast('Nouveau code enregistré 🔒'); return finishUnlock();
  }
  // déverrouillage : par le serveur si le compte en ligne existe, sinon sur l'appareil
  const lock = await KV.get('lock', null), info = await serverInfo(true);
  if (info?.account) {
    const r = await api('POST', '/login', { pin }).catch(() => null);
    if (r?.ok) return onlineUnlocked(pin, r.data.token);
    if (r && (r.status === 401 || r.status === 423)) {
      if (r.data?.wait) await KV.set('lock', { ...(lock || {}), until: Date.now() + r.data.wait * 1000 });
      return shakeAndRetry();
    }
  }
  if (!lock) { toast('Connexion internet nécessaire pour la première ouverture sur cet appareil'); return viewLock(); }
  if (await matches(pin, lock)) {
    lock.fails = 0; lock.until = 0; await KV.set('lock', lock); lastPin = pin;
    if (!lock.rescue) { lockMode = 'parent'; return viewLock(); }    // code parent pas encore choisi
    if (info && !info.account && !(await KV.get('activateLater', false))) { lockMode = 'parent'; return viewLock(); }   // proposer le compte en ligne
    return finishUnlock();
  }
  lock.fails = (lock.fails || 0) + 1;
  if (lock.fails >= 5) lock.until = Date.now() + Math.min(15 * 60, 30 * 2 ** (lock.fails - 5)) * 1000;   // 30 s, 1 min, 2 min… 15 min max
  await KV.set('lock', lock);
  shakeAndRetry();
};
act.saveParent = async ev => {
  ev.preventDefault();
  const a = $('#pa-1').value.trim(), b = $('#pa-2').value.trim(), act8 = skipActivation ? null : $('#pa-act');
  if (a.length < PARENT_MIN) return toast(`Le code parent doit faire au moins ${PARENT_MIN} caractères`);
  if (a !== b) return toast('Les deux codes parent sont différents');
  if (act8) {                                         // activation du compte en ligne
    if (!lastPin) { lockMode = 'unlock'; toast('Retape d\'abord le code secret'); return viewLock(); }
    const r = await api('POST', '/setup', { pin: lastPin, parent: a, token: act8.value.trim().toUpperCase() }).catch(() => null);
    if (!r?.ok) return toast(r?.status === 403 ? 'Code d\'activation incorrect' : r?.status === 409 ? 'Le compte existe déjà : déverrouille avec le code secret' : 'Pas de connexion internet');
    await KV.set('session', r.data.token); online = { ok: true, account: true };
  } else if (unlocked && (await KV.get('session', ''))) {
    const r = await api('POST', '/parent', { parent: a }).catch(() => null);
    if (!r?.ok) return toast('Code parent non changé : il faut une connexion internet');
  }
  const lock = await KV.get('lock', null);
  lock.rescue = await sealed(a); await KV.set('lock', lock);
  if (act8) await firstLink();
  lockMode = 'unlock'; toast(act8 ? 'Compte en ligne activé ☁️' : 'Code parent enregistré 🗝️'); finishUnlock();
};
let skipActivation = false;
act.later = async () => {     // sans compte en ligne pour l'instant (activable ensuite dans les réglages)
  await KV.set('activateLater', true);
  if ((await KV.get('lock', null))?.rescue) { lockMode = 'unlock'; return finishUnlock(); }
  skipActivation = true; await act.saveParent({ preventDefault() {} }); skipActivation = false;
};
act.activate = () => { if (!lastPin) return toast('Déverrouille d\'abord l\'app avec le code secret'); lockMode = 'parent'; viewLock(); };
async function finishUnlock() { unlocked = true; setLocked(false); renderStreak(); route(); scheduleSync(300); }
act.cancelPin = () => { lockMode = 'unlock'; pinBuf = ''; firstPin = ''; setLocked(false); go('#/settings'); };
act.rescue = async ev => {
  ev.preventDefault();
  const lock = await KV.get('lock', null), code = $('#r-code').value.trim(), info = await serverInfo(true);
  if (!code) return;
  if (info?.account) { resetParent = code; lockMode = 'setup1'; pinBuf = ''; return viewLock(); }   // vérifié par le serveur à la fin
  if (!lock) return toast('Connexion internet nécessaire');
  if (lock.until > Date.now()) return toast('Trop d\'essais : attends un peu');
  if (await matches(code, lock.rescue)) { lock.fails = 0; lock.until = 0; await KV.set('lock', lock); lockMode = 'setup1'; pinBuf = ''; return viewLock(); }
  lock.fails = (lock.fails || 0) + 1;
  if (lock.fails >= 5) lock.until = Date.now() + Math.min(15 * 60, 30 * 2 ** (lock.fails - 5)) * 1000;
  await KV.set('lock', lock); toast('Code de secours incorrect');
};
act.changePin = () => { lockMode = 'setup1'; pinBuf = ''; viewLock(); };
act.changeParent = () => { lockMode = 'parent'; viewLock(); };
act.syncNow = async () => { toast('Synchronisation…'); await syncNow(); toast('Synchronisé ☁️'); viewSettings(); };
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') hiddenAt = Date.now();
  else if (unlocked && hiddenAt && Date.now() - hiddenAt > LOCK_AFTER) { unlocked = false; lockMode = 'unlock'; pinBuf = ''; viewLock(); }
});

// ---------- Routeur ----------
const routes = { '': viewHome, progress: viewProgress, new: viewNew, photos: viewPhotos, package: viewPackage, print: viewPrint, review: viewReview, lesson: viewLesson, fiche: viewFiche, daily: viewDaily, play: viewPlay, settings: viewSettings };
async function route() {
  if (!unlocked) return viewLock();
  const [name, ...args] = location.hash.replace(/^#\/?/, '').split('/');
  if (name !== 'play') window.speechSynthesis?.cancel();
  try { await (routes[name] || viewHome)(...args.map(decodeURIComponent)); }
  catch (e) { console.error(e); setView(`<div class="card"><h2>Oups</h2><p>${esc(e.message)}</p><a class="btn" href="#/">Accueil</a></div>`); }
}
function go(h) { if (location.hash === h) route(); else location.hash = h; }
window.addEventListener('hashchange', route);
document.addEventListener('keydown', ev => {
  if (document.body.classList.contains('locked') && $('.keypad') && /^([0-9]|Backspace)$/.test(ev.key)) { ev.preventDefault(); return act.key(ev.key === 'Backspace' ? '⌫' : ev.key); }
  if (ev.key === 'Enter' && $('#next')) { ev.preventDefault(); act.next(); }
});

navigator.storage?.persist?.().catch(() => {});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
// Mise à jour : l'app installée est reprise telle quelle quand on la rouvre (pas de rechargement).
// À l'ouverture et à chaque retour au premier plan, on compare avec la version en ligne et on recharge.
async function checkUpdate() {
  try {
    const text = await (await fetch('./index.html?check=' + Date.now(), { cache: 'no-store' })).text();
    const v = +(text.match(/const APP_VERSION = (\d+);/) || [])[1];
    if (!(v > APP_VERSION)) return;
    (await navigator.serviceWorker?.getRegistration())?.update().catch(() => {});
    if (location.hash.startsWith('#/play')) toast(`Nouvelle version ${v} : elle s'installera à la fin de la séance`);
    else location.reload();
  } catch {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
renderStreak();
loadStats().then(route);
checkUpdate();
</script>
